name: trusted-scan-worker

# Started on demand by the control plane when a visitor requests a scan, and
# by hand when needed. No schedule: an idle poll would burn Actions minutes to
# find an empty queue, and it would be the "serverless application" pattern
# GitHub's terms warn about. One run drains up to 50 jobs, so a request that
# missed its own dispatch is still picked up by the next visitor's run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-scan-worker
  cancel-in-progress: false

jobs:
  drain-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted worker revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir --mode=0700 "$tool_dir"
          tar --extract --gzip --file "$archive" --directory "$tool_dir" gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $tool_dir/gitleaks" | sha256sum --check --strict
          chmod 0700 "$tool_dir/gitleaks"
          echo "GITLEAKS_BINARY=$tool_dir/gitleaks" >> "$GITHUB_ENV"
          echo "GITLEAKS_SHA256=88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509" >> "$GITHUB_ENV"

      # zizmor audits GitHub Actions workflow files inside the same sandbox.
      # The engine, its broker manifest and its sandbox wiring have existed
      # since the zizmor lane was built; this download step was the one piece
      # missing, so every live scan reported the check as not switched on.
      - name: Download pinned zizmor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor_1.29.0_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/zizmor-1.29.0"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  $archive" | sha256sum --check --strict
          mkdir --mode=0700 "$tool_dir"
          tar --extract --gzip --file "$archive" --directory "$tool_dir" zizmor
          echo "a3331b0a69fc0d8bf8087b0d74d5424602c5a0f2fc2770afe2e908a1295692b5  $tool_dir/zizmor" | sha256sum --check --strict
          chmod 0700 "$tool_dir/zizmor"
          echo "ZIZMOR_BINARY=$tool_dir/zizmor" >> "$GITHUB_ENV"
          echo "ZIZMOR_SHA256=a3331b0a69fc0d8bf8087b0d74d5424602c5a0f2fc2770afe2e908a1295692b5" >> "$GITHUB_ENV"

      # Everything below is new. Scanning strangers' repositories requires the
      # same enforced isolation the CI workflow already proves on this exact
      # runner image, so the setup is copied from it rather than reinvented.
      - name: Build the isolated scan domain
        run: pnpm build:scan-domain

      - name: Install Linux scan-isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor-profiles \
            apparmor-utils \
            bubblewrap
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -o root -g root -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          sudo grep --fixed-strings --line-regexp \
            'bwrap (enforce)' /sys/kernel/security/apparmor/profiles
          test "$(stat --format='%U:%G:%a' /usr/bin/bwrap)" = "root:root:755"
          node_binary="$(realpath "$(command -v node)")"
          chmod go-w \
            "$node_binary" \
            "$GITHUB_WORKSPACE/apps/scan-domain/dist/scan-domain.mjs" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.toml" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.ignore"
          for trusted_file in \
            "$node_binary" \
            "$GITHUB_WORKSPACE/apps/scan-domain/dist/scan-domain.mjs" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.toml" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.ignore"; do
            test "$(( 8#$(stat --format='%a' "$trusted_file") & 8#22 ))" -eq 0
          done
          echo "BUBBLEWRAP_BINARY=/usr/bin/bwrap" >> "$GITHUB_ENV"
          echo "SCAN_NODE_BINARY=$node_binary" >> "$GITHUB_ENV"
          echo "SCAN_DOMAIN_BUNDLE=$GITHUB_WORKSPACE/apps/scan-domain/dist/scan-domain.mjs" >> "$GITHUB_ENV"
          echo "SCAN_RUNTIME_LIBRARY_PATHS=/lib/x86_64-linux-gnu,/usr/lib/x86_64-linux-gnu,/lib64" >> "$GITHUB_ENV"

      - name: Drain queued scans
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          WORKER_ID: worker_github_actions_01
          WORKER_KEY_GENERATION: "1"
          WORKER_SECRET: ${{ secrets.SCAN_WORKER_SECRET }}
          GITHUB_TOKEN: ${{ secrets.SCAN_GITHUB_TOKEN }}
          # Public scope. The worker constructor refuses to start unless
          # SCAN_ISOLATION_MODE is bubblewrap and the in-namespace escape probe
          # passes, so this cannot silently degrade to an unsandboxed scan.
          PUBLIC_WORKER: "true"
          SCAN_ISOLATION_MODE: bubblewrap
          # All-or-none: with this true the config requires the pinned binary
          # above, and with it false the binary variables are refused.
          ZIZMOR_ENABLED: "true"
          SCRATCH_PATH: ${{ runner.temp }}/repo-security-scratch
          MAX_JOBS_PER_TICK: "50"
          RUN_ONCE: "true"
          # Council review. Two distinct model families must both reject a
          # finding before it is dropped, so fewer than two keys present means
          # review simply never runs and every finding is reported.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm dev:worker
