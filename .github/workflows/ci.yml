name: private-slice-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gitleaks_8.30.1_linux_x64.tar.gz
          tool_dir=/tmp/gitleaks-8.30.1
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir --mode=0700 "$tool_dir"
          tar --extract --gzip --file "$archive" --directory "$tool_dir" gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $tool_dir/gitleaks" | sha256sum --check --strict
          chmod 0700 "$tool_dir/gitleaks"
          echo "GITLEAKS_BINARY=$tool_dir/gitleaks" >> "$GITHUB_ENV"
          echo "GITLEAKS_SHA256=88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509" >> "$GITHUB_ENV"

      - name: Download pinned zizmor
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/zizmor_1.29.0_linux_x64.tar.gz
          tool_dir=/tmp/zizmor-1.29.0
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  $archive" | sha256sum --check --strict
          mkdir --mode=0700 "$tool_dir"
          tar --extract --gzip --file "$archive" --directory "$tool_dir" zizmor
          echo "a3331b0a69fc0d8bf8087b0d74d5424602c5a0f2fc2770afe2e908a1295692b5  $tool_dir/zizmor" | sha256sum --check --strict
          chmod 0700 "$tool_dir/zizmor"
          echo "ZIZMOR_BINARY=$tool_dir/zizmor" >> "$GITHUB_ENV"
          echo "ZIZMOR_SHA256=a3331b0a69fc0d8bf8087b0d74d5424602c5a0f2fc2770afe2e908a1295692b5" >> "$GITHUB_ENV"

      - name: Download pinned OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          binary=/tmp/osv-scanner-2.5.0
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "$binary" \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  $binary" | sha256sum --check --strict
          chmod 0700 "$binary"
          echo "OSV_SCANNER_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage floor
        run: pnpm test:coverage

      - name: Test Cloudflare runtime and D1 behavior
        run: pnpm test:workers

      - name: Apply D1 migrations to a fresh local database
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$(mktemp -d)"
          trap 'rm -rf "$proof_dir"' EXIT
          pnpm exec wrangler d1 migrations apply DB \
            --local \
            --config apps/control-plane/wrangler.jsonc \
            --persist-to "$proof_dir"

      - name: Real-binary union-of-egress proof
        env:
          RUN_GITLEAKS_E2E: "1"
        run: pnpm vitest run apps/api/test/e2e.test.ts

      - name: Build deployable web and control plane bundle
        run: pnpm build:all

      - name: Install Linux scan-isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor-profiles \
            apparmor-utils \
            bubblewrap
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -o root -g root -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          sudo grep --fixed-strings --line-regexp \
            'bwrap (enforce)' /sys/kernel/security/apparmor/profiles
          test "$(stat --format='%U:%G:%a' /usr/bin/bwrap)" = "root:root:755"
          node_binary="$(realpath "$(command -v node)")"
          chmod go-w \
            "$node_binary" \
            "$GITHUB_WORKSPACE/apps/scan-domain/dist/scan-domain.mjs" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.toml" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.ignore"
          for trusted_file in \
            "$node_binary" \
            "$GITHUB_WORKSPACE/apps/scan-domain/dist/scan-domain.mjs" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.toml" \
            "$GITHUB_WORKSPACE/packages/scanners/config/gitleaks.ignore"; do
            test "$(( 8#$(stat --format='%a' "$trusted_file") & 8#22 ))" -eq 0
          done
          echo "BUBBLEWRAP_BINARY=/usr/bin/bwrap" >> "$GITHUB_ENV"
          echo "SCAN_NODE_BINARY=$node_binary" >> "$GITHUB_ENV"
          echo "SCAN_DOMAIN_BUNDLE=$GITHUB_WORKSPACE/apps/scan-domain/dist/scan-domain.mjs" >> "$GITHUB_ENV"
          echo "SCAN_RUNTIME_LIBRARY_PATHS=/lib/x86_64-linux-gnu,/usr/lib/x86_64-linux-gnu,/lib64" >> "$GITHUB_ENV"

      - name: Prove credential-free no-network Linux scan domain
        env:
          RUN_BWRAP_E2E: "1"
          WORKER_SECRET: "must-not-enter-the-scan-domain-000000000000000000000000"
          GITHUB_TOKEN: "must-not-enter-the-scan-domain"
        run: pnpm vitest run apps/scan-worker/test/live-bubblewrap.test.ts

      - name: Self-scan locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$OSV_SCANNER_BINARY" scan source \
            --lockfile pnpm-lock.yaml \
            --no-resolve \
            --format json \
            --verbosity error \
            > /tmp/osv-self-scan.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("/tmp/osv-self-scan.json", "utf8"));
            if (!Array.isArray(report.results) || report.results.length !== 0) process.exit(1);
          '

      - name: Self-scan workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          "$ZIZMOR_BINARY" \
            --offline \
            --no-config \
            --no-ignores \
            --collect=all \
            --strict-collection \
            --format=json-v1 \
            . > /tmp/zizmor-self-scan.json
          test "$(tr -d '[:space:]' < /tmp/zizmor-self-scan.json)" = "[]"

      - name: Self-scan repository tree and history
        shell: bash
        run: |
          set -euo pipefail
          "$GITLEAKS_BINARY" dir \
            --config packages/scanners/config/gitleaks.toml \
            --gitleaks-ignore-path packages/scanners/config/gitleaks.ignore \
            --ignore-gitleaks-allow \
            --max-archive-depth 0 \
            --max-decode-depth 2 \
            --max-target-megabytes 20 \
            --exit-code 1 \
            --report-format json \
            --report-path /tmp/gitleaks-self-scan.json \
            --redact=100 \
            --log-level error \
            --no-banner \
            --no-color \
            .
          test "$(tr -d '[:space:]' < /tmp/gitleaks-self-scan.json)" = "[]"
          "$GITLEAKS_BINARY" git \
            --config packages/scanners/config/gitleaks.toml \
            --gitleaks-ignore-path packages/scanners/config/gitleaks.ignore \
            --ignore-gitleaks-allow \
            --max-decode-depth 2 \
            --exit-code 1 \
            --report-format json \
            --report-path /tmp/gitleaks-history-scan.json \
            --redact=100 \
            --log-level error \
            --no-banner \
            --no-color \
            .
          test "$(tr -d '[:space:]' < /tmp/gitleaks-history-scan.json)" = "[]"
